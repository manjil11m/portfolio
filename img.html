<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANJIL-IMAGE GENERATION</title>
    <style>
        /* Base Styles */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Heading Styles */
        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
            display: inline-block;
            padding-bottom: 10px;
        }

        /* Gallery Styles */
        .container {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #222;
            background-color: #111;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        /* Footer Styles */
        footer {
            text-align: center;
            padding: 40px 20px;
            background-color: #0a0a0a;
            border-top: 1px solid #222;
        }

        footer p {
            margin: 0 0 10px 0;
            color: #aaa;
        }

        footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #00bcd4; /* Subtle accent color on hover */
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Heading Section -->
    <header>
        <h1>image generation</h1>
    </header>

    <!-- Gallery Section -->
