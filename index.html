<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANJILVERSE</title>
    
    <!-- Clean Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.12);
            --bg-dark: #020205;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- Minimalist HUD Overlay --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(2rem, 4vw, 3.5rem);
        }

        /* Top Bar */
        .top-hud {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(0.65rem, 1.2vw, 0.75rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 4px;
            height: 4px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Centered Header */
        .hero-header {
            width: 100%;
            max-width: 700px;
            text-align: center;
            pointer-events: auto;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            font-weight: 400;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #ffffff;
            margin-right: -0.5em;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
            line-height: 1.2;
        }

        .tagline {
            font-size: clamp(0.65rem, 1.1vw, 0.75rem);
            letter-spacing: 0.35em;
            color: var(--text-muted);
            margin-top: 1.2rem;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* Minimalist Action Button */
        .action-area {
            pointer-events: auto;
            text-align: center;
            margin-bottom: clamp(1rem, 2vw, 2rem);
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-light);
            color: #ffffff;
            padding: 14px 38px;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            border-radius: 100px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .enter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.35em;
            transform: translateY(-2px);
        }

        /* Stage Instructions */
        .stage-instructions {
            position: absolute;
            bottom: 2.5rem;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        /* Hover Tooltip Card */
        #universe-card {
            position: absolute;
            padding: 12px 20px;
            background: rgba(8, 10, 16, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            backdrop-filter: blur(12px);
            color: #ffffff;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -130%);
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 30;
            text-align: center;
        }

        #universe-card h3 {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #ffffff;
            margin-bottom: 2px;
        }

        #universe-card p {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        /* Cinematic Dark Vignette */
        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.95);
            pointer-events: none;
            z-index: 2;
        }
    </style>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div class="vignette"></div>
    <div id="webgl-container"></div>

    <div class="ui-layer">
        <div class="top-hud">
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>MANJILVERSE / BULK ARCHITECTURE</span>
            </div>
            <div>[ LEVEL II MULTIVERSE ]</div>
        </div>

        <header class="hero-header" id="heroHeader">
            <h1 class="title">MANJILVERSE</h1>
            <p class="tagline">Explore Parallel Design Dimensions</p>
        </header>

        <div class="action-area" id="actionArea">
            <button class="enter-btn" id="enterBtn">Enter Multiverse</button>
        </div>

        <div class="stage-instructions" id="stageInstructions">
            Select a pocket universe to enter dimension
        </div>
    </div>

    <!-- Minimal Tooltip -->
    <div id="universe-card">
        <h3 id="card-title">Universe Name</h3>
        <p id="card-desc">Click to warp</p>
    </div>

    <script>
        // --- 1. SETUP ENGINE & RESPONSIVE CAMERA ---
        const container = document.getElementById('webgl-container');
        const card = document.getElementById('universe-card');
        const cardTitle = document.getElementById('card-title');
        const cardDesc = document.getElementById('card-desc');

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        function getInitialCameraZ() {
            return window.innerWidth < 768 ? 30 : 24;
        }

        function getInsideCameraZ() {
            return window.innerWidth < 768 ? 14 : 11;
        }

        camera.position.set(0, 0, getInitialCameraZ());

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.PointLight(0xe0f2fe, 1.8, 80);
        mainLight.position.set(0, 0, 0);
        scene.add(mainLight);

        // --- 3. BACKGROUND STARFIELD ---
        const starCount = 8000;
        const starGeom = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 300;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 300;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 300;

            const brightness = 0.5 + Math.random() * 0.5;
            starColors[i * 3] = brightness;
            starColors[i * 3 + 1] = brightness * 0.95;
            starColors[i * 3 + 2] = brightness * 1.1;
        }

        starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeom.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starMat = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.7
        });

        const starField = new THREE.Points(starGeom, starMat);
        scene.add(starField);

        // --- 4. REALISTIC MULTIVERSE CORE ---
        const multiverseGroup = new THREE.Group();
        scene.add(multiverseGroup);

        // Center Vacuum Core
        const coreGeom = new THREE.SphereGeometry(3, 64, 64);
        const coreMat = new THREE.MeshBasicMaterial({ 
            color: 0x000000,
            transparent: true,
            opacity: 1
        });
        const blackHoleCore = new THREE.Mesh(coreGeom, coreMat);
        multiverseGroup.add(blackHoleCore);

        // Accretion Dust Disk
        const diskCount = 10000;
        const diskGeom = new THREE.BufferGeometry();
        const diskPositions = new Float32Array(diskCount * 3);
        const diskColors = new Float32Array(diskCount * 3);

        for (let i = 0; i < diskCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 3.2 + Math.random() * 6.5;

            diskPositions[i * 3] = Math.cos(angle) * radius;
            diskPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
            diskPositions[i * 3 + 2] = Math.sin(angle) * radius;

            const alpha = 1 - (radius - 3.2) / 6.5;
            diskColors[i * 3] = 0.8 * alpha;
            diskColors[i * 3 + 1] = 0.9 * alpha;
            diskColors[i * 3 + 2] = 1.0 * alpha;
        }

        diskGeom.setAttribute('position', new THREE.BufferAttribute(diskPositions, 3));
        diskGeom.setAttribute('color', new THREE.BufferAttribute(diskColors, 3));

        const diskMat = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const accretionDisk = new THREE.Points(diskGeom, diskMat);
        accretionDisk.rotation.x = Math.PI / 6;
        multiverseGroup.add(accretionDisk);

        // Glass Shell
        const glassGeom = new THREE.SphereGeometry(5.2, 64, 64);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0x1e293b,
            wireframe: true,
            transparent: true,
            opacity: 0.08,
            roughness: 0.1,
            metalness: 0.9
        });
        const glassShell = new THREE.Mesh(glassGeom, glassMat);
        multiverseGroup.add(glassShell);

        // --- 5. THE 4 REDESIGNED SUB-UNIVERSES (PERFECT SPHERES WITH INTERNAL STARS) ---
        const universesData = [
            { name: "OS Universe", url: "os.html", desc: "Operating System Interface", pos: new THREE.Vector3(-4.4, 2.1, 0) },
            { name: "Message Universe", url: "msg.html", desc: "Messaging & Social Platform", pos: new THREE.Vector3(4.4, 2.1, 0) },
            { name: "Game Universe", url: "game.html", desc: "Interactive Arcade Dimension", pos: new THREE.Vector3(-4.4, -2.1, 0) },
            { name: "Corkboard Universe", url: "corkboard.html", desc: "Tactile Pinboard Workspace", pos: new THREE.Vector3(4.4, -2.1, 0) }
        ];

        const universesGroup = new THREE.Group();
        const raycastTargets = [];
        universesGroup.scale.set(0.001, 0.001, 0.001); // Hidden initially
        scene.add(universesGroup);

        universesData.forEach((data) => {
            const uGroup = new THREE.Group();
            uGroup.position.copy(data.pos);

            // 1. Core Sphere (Perfect high-segment sphere)
            const orbCore = new THREE.Mesh(
                new THREE.SphereGeometry(1.15, 64, 64),
                new THREE.MeshStandardMaterial({
                    color: 0x0a101d,
                    emissive: 0x38bdf8,
                    emissiveIntensity: 0.25,
                    roughness: 0.15,
                    metalness: 0.85
                })
            );

            // 2. Geodesic Atmosphere Cage (Replaces tilted ring, perfectly spherical)
            const cageMesh = new THREE.Mesh(
                new THREE.IcosahedronGeometry(1.35, 2),
                new THREE.MeshBasicMaterial({
                    color: 0xe0f2fe,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.15
                })
            );

            // 3. Mini Galaxy Particles INSIDE the pocket universe
            const innerStarCount = 120;
            const innerStarGeom = new THREE.BufferGeometry();
            const innerPos = new Float32Array(innerStarCount * 3);
            for (let i = 0; i < innerStarCount; i++) {
                const r = Math.random() * 0.95;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                innerPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                innerPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                innerPos[i * 3 + 2] = r * Math.cos(phi);
            }
            innerStarGeom.setAttribute('position', new THREE.BufferAttribute(innerPos, 3));
            const innerStars = new THREE.Points(
                innerStarGeom,
                new THREE.PointsMaterial({
                    size: 0.05,
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.85
                })
            );

            uGroup.add(orbCore);
            uGroup.add(cageMesh);
            uGroup.add(innerStars);

            uGroup.userData = {
                name: data.name,
                url: data.url,
                desc: data.desc,
                core: orbCore,
                cage: cageMesh
            };

            universesGroup.add(uGroup);
            raycastTargets.push(orbCore);
        });

        // --- 6. MOUSE PARALLAX & RAYCASTING ---
        let mouse = new THREE.Vector2();
        let targetMouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let hoveredObj = null;
        let isInsideMultiverse = false;

        window.addEventListener('mousemove', (e) => {
            targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            card.style.left = `${e.clientX}px`;
            card.style.top = `${e.clientY}px`;
        });

        // --- 7. ENTER MULTIVERSE TRANSITION ---
        const enterBtn = document.getElementById('enterBtn');
        const heroHeader = document.getElementById('heroHeader');
        const actionArea = document.getElementById('actionArea');
        const stageInstructions = document.getElementById('stageInstructions');

        function triggerMultiverseEnter() {
            if (isInsideMultiverse) return;
            isInsideMultiverse = true;

            gsap.to(actionArea, { opacity: 0, pointerEvents: 'none', duration: 0.5 });
            gsap.to(heroHeader, { y: -window.innerHeight * 0.35, scale: 0.8, duration: 1.2, ease: "power3.out" });
            gsap.to(stageInstructions, { opacity: 1, duration: 1, delay: 0.8 });

            gsap.to(camera.position, { 
                z: getInsideCameraZ(), 
                duration: 2.0, 
                ease: "power2.inOut" 
            });

            gsap.to(multiverseGroup.scale, { 
                x: 2.2, 
                y: 2.2, 
                z: 2.2, 
                duration: 2.0, 
                ease: "power2.inOut" 
            });

            gsap.to(blackHoleCore.material, { 
                opacity: 0.15, 
                duration: 1.2 
            });

            gsap.to(universesGroup.scale, { 
                x: 1, 
                y: 1, 
                z: 1, 
                duration: 1.4, 
                delay: 0.8, 
                ease: "back.out(1.2)" 
            });
        }

        enterBtn.addEventListener('click', triggerMultiverseEnter);

        window.addEventListener('wheel', (e) => {
            if (e.deltaY > 20 && !isInsideMultiverse) triggerMultiverseEnter();
        });

        // --- 8. WARP TO TARGET PAGE ON UNIVERSE CLICK ---
        window.addEventListener('click', () => {
            if (!isInsideMultiverse) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(raycastTargets);

            if (intersects.length > 0) {
                const selectedCore = intersects[0].object;
                const parentGroup = selectedCore.parent;
                const data = parentGroup.userData;

                gsap.to(card, { opacity: 0, duration: 0.2 });

                gsap.to(camera.position, {
                    x: parentGroup.position.x,
                    y: parentGroup.position.y,
                    z: parentGroup.position.z + 0.2,
                    duration: 1.2,
                    ease: "power3.in"
                });

                gsap.to(parentGroup.scale, {
                    x: 10,
                    y: 10,
                    z: 10,
                    duration: 1.2,
                    ease: "power3.in",
                    onComplete: () => {
                        window.location.href = data.url;
                    }
                });

                gsap.to('.ui-layer', { opacity: 0, duration: 0.5 });
            }
        });

        // --- 9. RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            mouse.x += (targetMouse.x - mouse.x) * 0.04;
            mouse.y += (targetMouse.y - mouse.y) * 0.04;

            camera.position.x = mouse.x * 1.2;
            camera.position.y = mouse.y * 1.2;

            accretionDisk.rotation.y = elapsedTime * 0.08;
            glassShell.rotation.y = elapsedTime * -0.02;
            starField.rotation.y = elapsedTime * 0.008;

            if (isInsideMultiverse) {
                universesGroup.children.forEach((uGroup, idx) => {
                    uGroup.rotation.y = elapsedTime * 0.15;
                    uGroup.userData.cage.rotation.x = elapsedTime * 0.2;
                    uGroup.userData.cage.rotation.z = elapsedTime * 0.1;
                    uGroup.position.y = universesData[idx].pos.y + Math.sin(elapsedTime * 1.5 + idx) * 0.1;
                });

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(raycastTargets);

                if (intersects.length > 0) {
                    const intersectedCore = intersects[0].object;
                    const parentGroup = intersectedCore.parent;

                    if (hoveredObj !== parentGroup) {
                        hoveredObj = parentGroup;

                        cardTitle.innerText = hoveredObj.userData.name;
                        cardDesc.innerText = hoveredObj.userData.desc;
                        card.style.opacity = '1';

                        gsap.to(hoveredObj.scale, { x: 1.25, y: 1.25, z: 1.25, duration: 0.3 });
                    }
                } else {
                    if (hoveredObj) {
                        gsap.to(hoveredObj.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
                        hoveredObj = null;
                        card.style.opacity = '0';
                    }
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- 10. RESPONSIVE RESIZE ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            if (!isInsideMultiverse) {
                camera.position.z = getInitialCameraZ();
            } else {
                camera.position.z = getInsideCameraZ();
            }

            if (width < 768) {
                universesData[0].pos.set(-2.5, 3.5, 0);
                universesData[1].pos.set(2.5, 3.5, 0);
                universesData[2].pos.set(-2.5, -2.1, 0);
                universesData[3].pos.set(2.5, -2.1, 0);
            } else {
                universesData[0].pos.set(-4.4, 2.1, 0);
                universesData[1].pos.set(4.4, 2.1, 0);
                universesData[2].pos.set(-4.4, -2.1, 0);
                universesData[3].pos.set(4.4, -2.1, 0);
            }

            universesGroup.children.forEach((uGroup, idx) => {
                uGroup.position.copy(universesData[idx].pos);
            });

            renderer.setSize(width, height);
        });

        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>
