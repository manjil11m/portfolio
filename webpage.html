    <style>
        /* Base Styles */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Heading Styles */
        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
            display: inline-block;
            padding-bottom: 10px;
        }
        /* Footer Styles */
        footer {
            text-align: center;
            padding: 40px 20px;
            background-color: #0a0a0a;
            border-top: 1px solid #222;
        }

        footer p {
            margin: 0 0 10px 0;
            color: #aaa;
        }

        footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #00bcd4; /* Subtle accent color on hover */
            text-decoration: underline;
        }
    </style>
</head>
